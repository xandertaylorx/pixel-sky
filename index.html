<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1230">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pixel Sky</title>
<style>
:root{--ink:#f6efe2;--dim:rgba(246,239,226,.62);--panel:rgba(10,14,32,.92);--line:rgba(255,255,255,.16);--accent:#ffcf6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1230;overflow:hidden;color:var(--ink);font:12px/1.4 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
body.idle{cursor:none}
#stage{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#ui{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:5;opacity:0;transition:opacity .5s;pointer-events:none}
#ui.on{opacity:1;pointer-events:auto}
.btn{appearance:none;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
.btn:hover,.btn:focus-visible{border-color:var(--accent);outline:none}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.35)}
.row{display:flex;gap:8px}
#panel{width:min(340px,calc(100vw - 28px));max-height:calc(100vh - 90px);overflow:auto;background:var(--panel);border:2px solid var(--line);box-shadow:5px 5px 0 rgba(0,0,0,.4);padding:14px;backdrop-filter:blur(6px)}
#panel[hidden]{display:none}
#panel h2{margin:14px 0 8px;font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:600}
#panel h2:first-child{margin-top:0}
#panel label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0;color:var(--dim)}
#panel input[type=text],#panel select{background:#05081a;color:var(--ink);border:2px solid var(--line);font:inherit;padding:6px 8px;min-width:0}
#panel input[type=text]{width:100%}
#panel input[type=range]{width:100%;accent-color:var(--accent)}
#panel input:focus,#panel select:focus{outline:none;border-color:var(--accent)}
#results{list-style:none;margin:6px 0 0;padding:0}
#results button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;padding:7px 2px;cursor:pointer}
#results button:hover,#results button:focus-visible{color:var(--accent);outline:none}
.hint{color:var(--dim);font-size:11px;margin-top:10px}
#cur{color:var(--ink)}
@media (prefers-reduced-motion:reduce){#ui{transition:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="sky" role="img" aria-label="Pixel landscape clock"></canvas></div>
<div id="ui">
  <section id="panel" hidden aria-label="Settings">
    <h2>LOCATION</h2>
    <div id="cur">—</div>
    <input type="text" id="q" placeholder="Search a city…" autocomplete="off" spellcheck="false" aria-label="Search city">
    <ul id="results"></ul>
    <div class="row" style="margin-top:8px"><button class="btn" id="geo" style="flex:1">Use my location</button></div>
    <h2>DISPLAY</h2>
    <label>Temperature <select id="units"><option value="c">°C</option><option value="f">°F</option></select></label>
    <label>Clock <select id="h12"><option value="0">24 hour</option><option value="1">12 hour</option></select></label>
    <label>Scene <select id="scene"><option value="auto">Auto (by location)</option><option value="nature">Lake &amp; mountains</option><option value="london">London</option><option value="manchester">Manchester</option><option value="liverpool">Liverpool</option><option value="edinburgh">Edinburgh</option><option value="paris">Paris</option><option value="newyork">New York</option><option value="tokyo">Tokyo</option><option value="sydney">Sydney</option></select></label>
    <label>Seconds <select id="secs"><option value="0">Bar only</option><option value="1">Bar + digits</option></select></label>
    <h2>PREVIEW</h2>
    <label>Weather <select id="preset">
      <option value="live">Live</option><option value="clear">Clear</option><option value="partly">Partly cloudy</option>
      <option value="overcast">Overcast</option><option value="fog">Fog</option><option value="drizzle">Drizzle</option>
      <option value="rain">Rain</option><option value="storm">Thunderstorm</option><option value="snow">Snow</option></select></label>
    <label>Time of day <span id="tlab">now</span></label>
    <input type="range" id="tod" min="0" max="1439" step="5" aria-label="Time of day">
    <label>Speed <select id="speed"><option value="1">Real time</option><option value="60">1 min / sec</option><option value="600">10 min / sec</option><option value="3600">1 hr / sec</option></select></label>
    <div class="row" style="margin-top:8px"><button class="btn" id="reset" style="flex:1">Back to now</button></div>
    <p class="hint">F fullscreen · S settings<br>Weather by Open-Meteo. Sun &amp; moon computed locally.</p>
  </section>
  <div class="row"><button class="btn" id="fs" aria-label="Toggle fullscreen">Full</button><button class="btn" id="gear" aria-label="Settings" aria-expanded="false">Set</button></div>
</div>

<script>
(()=>{
'use strict';
/* ============================================================ helpers */
const {PI,sin,cos,tan,asin,acos,atan2,exp,floor,ceil,round,abs,min,max,sqrt,pow}=Math;
const rad=PI/180;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const mul=(a,m)=>[a[0]*m[0],a[1]*m[1],a[2]*m[2]];
const sc3=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const pad2=n=>String(n).padStart(2,'0');
const hash2=(x,y)=>{let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function vnoise(r,n){const p=Array.from({length:n},r);return x=>{const i=floor(x),f=x-i,s=f*f*(3-2*f);const a=p[((i%n)+n)%n],b=p[(((i+1)%n)+n)%n];return a+(b-a)*s}}
function tab(T,x){if(x<=T[0][0])return T[0].slice(1);for(let i=1;i<T.length;i++){if(x<=T[i][0]){const a=T[i-1],b=T[i],t=(x-a[0])/(b[0]-a[0]);const r=[];for(let k=1;k<a.length;k++)r.push(lerp(a[k],b[k],t));return r}}return T[T.length-1].slice(1)}
const pack=(r,g,b)=>0xff000000|((b<0?0:b>255?255:b|0)<<16)|((g<0?0:g>255?255:g|0)<<8)|(r<0?0:r>255?255:r|0);
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('pixelsky.'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('pixelsky.'+k,JSON.stringify(v))}catch{}}};

/* ============================================================ state */
const qs=new URLSearchParams(location.search);
const defUnits=(navigator.language||'').toLowerCase()==='en-us'?'f':'c';
let h12def=false;try{h12def=!!new Intl.DateTimeFormat(undefined,{hour:'numeric'}).resolvedOptions().hour12}catch{}
const S={
  loc:store.get('loc',null),units:store.get('units',defUnits),h12:store.get('h12',h12def),secs:store.get('secs',false),scene:store.get('scene','auto'),
  wx:store.get('wx',null),preset:'live',simBase:Date.now(),realBase:Date.now(),speed:1,
};
if(qs.get('loc')){const [a,b]=qs.get('loc').split(',').map(Number);if(isFinite(a)&&isFinite(b))S.loc={lat:a,lon:b,name:qs.get('name')||'',tz:qs.get('tz')||Intl.DateTimeFormat().resolvedOptions().timeZone,mode:'manual'}}
if(qs.get('preset'))S.preset=qs.get('preset');
if(qs.get('speed'))S.speed=+qs.get('speed')||1;
const LAT=()=>S.loc?S.loc.lat:40.7, LON=()=>S.loc?S.loc.lon:-74;
const TZ=()=>(S.loc&&S.loc.tz)||Intl.DateTimeFormat().resolvedOptions().timeZone;
const simNow=()=>S.simBase+(Date.now()-S.realBase)*S.speed;

const PRESETS={clear:{code:0,cover:6},partly:{code:2,cover:48},overcast:{code:3,cover:97},fog:{code:45,cover:85},drizzle:{code:51,cover:88},rain:{code:63,cover:93},storm:{code:95,cover:98},snow:{code:73,cover:93,t:-2}};
const RAINI={51:.2,53:.3,55:.4,56:.25,57:.4,61:.4,63:.65,65:.95,66:.5,67:.8,80:.5,81:.75,82:1,95:.8,96:.9,99:1};
const SNOWI={71:.3,73:.55,75:.9,77:.3,85:.5,86:.85};
const DESC={45:'FOG',48:'RIME FOG',51:'LIGHT DRIZZLE',53:'DRIZZLE',55:'HEAVY DRIZZLE',56:'FREEZING DRIZZLE',57:'FREEZING DRIZZLE',61:'LIGHT RAIN',63:'RAIN',65:'HEAVY RAIN',66:'FREEZING RAIN',67:'FREEZING RAIN',71:'LIGHT SNOW',73:'SNOW',75:'HEAVY SNOW',77:'SNOW GRAINS',80:'RAIN SHOWERS',81:'RAIN SHOWERS',82:'HEAVY SHOWERS',85:'SNOW SHOWERS',86:'HEAVY SNOW',95:'THUNDERSTORM',96:'STORM AND HAIL',99:'STORM AND HAIL'};
function eff(){
  const live=S.wx||{t:null,code:0,cover:12,wind:6};
  if(S.preset==='live'||!PRESETS[S.preset])return live;
  const p=PRESETS[S.preset];
  return{...live,code:p.code,cover:p.cover,t:p.t!==undefined?p.t:(live.t==null?12:live.t)};
}
function targets(w){
  const rain=RAINI[w.code]||0,snow=SNOWI[w.code]||0,fog=w.code===45?.7:w.code===48?.9:0,thunder=w.code>=95?1:0;
  let cover=w.cover;if(rain||snow)cover=max(cover,72+22*(rain||snow));if(fog)cover=max(cover,60);
  return{cover,rain,snow,fog,thunder,wind:w.wind||0,temp:w.t==null?15:w.t};
}
function describe(w,dark){
  if(DESC[w.code])return DESC[w.code];
  const c=w.cover;
  if(c<15)return dark>.5?'CLEAR NIGHT':'CLEAR SKY';
  if(c<40)return'MOSTLY CLEAR';if(c<70)return'PARTLY CLOUDY';if(c<90)return'MOSTLY CLOUDY';return'OVERCAST';
}
const WS={cover:10,rain:0,snow:0,fog:0,thunder:0,wind:6,temp:15,snowC:0};
let wsInit=false;

/* ============================================================ sun & moon (SunCalc maths) */
const E=rad*23.4397;
const toDays=ms=>ms/864e5-0.5+2440588-2451545;
const rightAsc=(l,b)=>atan2(sin(l)*cos(E)-tan(b)*sin(E),cos(l));
const decl=(l,b)=>asin(sin(b)*cos(E)+cos(b)*sin(E)*sin(l));
const azim=(H,phi,dec)=>atan2(sin(H),cos(H)*sin(phi)-tan(dec)*cos(phi));
const alti=(H,phi,dec)=>asin(sin(phi)*sin(dec)+cos(phi)*cos(dec)*cos(H));
const sidereal=(d,lw)=>rad*(280.16+360.9856235*d)-lw;
function sunCoords(d){const M=rad*(357.5291+0.98560028*d);const C=rad*(1.9148*sin(M)+0.02*sin(2*M)+0.0003*sin(3*M));const L=M+C+rad*102.9372+PI;return{dec:decl(L,0),ra:rightAsc(L,0)}}
function moonCoords(d){const L=rad*(218.316+13.176396*d),M=rad*(134.963+13.064993*d),F=rad*(93.272+13.22935*d);const l=L+rad*6.289*sin(M),b=rad*5.128*sin(F),dt=385001-20905*cos(M);return{ra:rightAsc(l,b),dec:decl(l,b),dist:dt}}
function celestial(t){
  const d=toDays(t),lw=rad*-LON(),phi=rad*LAT();
  const sc=sunCoords(d),mc=moonCoords(d);
  let H=sidereal(d,lw)-sc.ra;
  const sun={az:azim(H,phi,sc.dec),alt:alti(H,phi,sc.dec)};
  H=sidereal(d,lw)-mc.ra;
  const moon={az:azim(H,phi,mc.dec),alt:alti(H,phi,mc.dec)};
  moon.alt-=asin(6371/mc.dist*cos(moon.alt));
  const sdist=149598000;
  const ph=acos(sin(sc.dec)*sin(mc.dec)+cos(sc.dec)*cos(mc.dec)*cos(sc.ra-mc.ra));
  const inc=atan2(sdist*sin(ph),mc.dist-sdist*cos(ph));
  const ang=atan2(cos(sc.dec)*sin(sc.ra-mc.ra),sin(sc.dec)*cos(mc.dec)-cos(sc.dec)*sin(mc.dec)*cos(sc.ra-mc.ra));
  moon.frac=(1+cos(inc))/2;
  moon.phase=0.5+0.5*inc*(ang<0?-1:1)/PI;
  return{sun,moon};
}
function moonName(p){const k=p*8;if(k<.5||k>=7.5)return'NEW';if(k<1.5)return'WAXING CRESCENT';if(k<2.5)return'FIRST QUARTER';if(k<3.5)return'WAXING GIBBOUS';if(k<4.5)return'FULL';if(k<5.5)return'WANING GIBBOUS';if(k<6.5)return'LAST QUARTER';return'WANING CRESCENT'}

/* ============================================================ palettes */
const SKYT=[[-18,4,6,20,10,16,40],[-12,8,12,36,24,30,66],[-6,22,32,76,96,70,110],[-2,40,62,120,226,120,96],[2,60,100,170,250,170,110],[8,72,130,205,200,205,215],[25,60,125,215,170,210,245],[90,45,110,205,150,205,245]];
const AMB=[[-18,.17,.22,.40],[-8,.25,.30,.50],[-3,.55,.45,.58],[0,1,.62,.46],[5,1.05,.80,.62],[15,1.02,.94,.86],[40,1,1,1]];
const GLOW=[[-10,200,90,120],[-2,255,110,70],[4,255,170,100],[15,255,225,170],[40,255,245,215]];
// doy, grass rgb, leaf rgb, leaf amount
const SEAS=[[0,118,128,108,110,90,70,0],[75,118,134,100,110,90,70,0],[110,102,160,72,130,190,90,.85],[160,70,142,56,58,138,66,1],[245,92,138,54,90,140,50,1],[275,128,134,56,210,150,40,.95],[300,126,116,58,200,96,36,.72],[325,116,108,84,160,70,40,.25],[345,118,128,108,110,90,70,0],[366,118,128,108,110,90,70,0]];

/* ============================================================ fonts */
const mk=(s,w)=>s.replace(/ /g,'');
const G3src={A:'010 101 111 101 101',B:'110 101 110 101 110',C:'011 100 100 100 011',D:'110 101 101 101 110',E:'111 100 110 100 111',F:'111 100 110 100 100',G:'011 100 101 101 011',H:'101 101 111 101 101',I:'111 010 010 010 111',J:'001 001 001 101 010',K:'101 101 110 101 101',L:'100 100 100 100 111',M:'101 111 111 101 101',N:'110 101 101 101 101',O:'010 101 101 101 010',P:'110 101 110 100 100',Q:'010 101 101 110 011',R:'110 101 110 101 101',S:'011 100 010 001 110',T:'111 010 010 010 010',U:'101 101 101 101 111',V:'101 101 101 101 010',W:'101 101 111 111 101',X:'101 101 010 101 101',Y:'101 101 010 010 010',Z:'111 001 010 100 111',
'0':'111 101 101 101 111','1':'010 110 010 010 111','2':'110 001 010 100 111','3':'110 001 010 001 110','4':'101 101 111 001 001','5':'111 100 110 001 110','6':'011 100 111 101 111','7':'111 001 010 010 010','8':'111 101 111 101 111','9':'111 101 111 001 110',
'.':'000 000 000 000 010',':':'000 010 000 010 000','-':'000 000 111 000 000','/':'001 001 010 100 100','%':'101 001 010 100 101','*':'111 101 111 000 000',',':'000 000 000 010 100','+':'000 010 111 010 000',' ':'000 000 000 000 000'};
const G3={};for(const k in G3src)G3[k]=mk(G3src[k]);
const BIGsrc=['01110 10001 10011 10101 11001 10001 01110','00100 01100 00100 00100 00100 00100 01110','01110 10001 00001 00010 00100 01000 11111','11110 00001 00001 01110 00001 00001 11110','00010 00110 01010 10010 11111 00010 00010','11111 10000 11110 00001 00001 10001 01110','00110 01000 10000 11110 10001 10001 01110','11111 00001 00010 00100 01000 01000 01000','01110 10001 10001 01110 10001 10001 01110','01110 10001 10001 01111 00001 00010 01100'];
const BIG=BIGsrc.map(mk);

/* ============================================================ canvas / buffer */
const cv=$('#sky'),ctx=cv.getContext('2d');
let W=0,H=0,ps=4,u=180,y0=0,img,buf;
function P(x,y,c){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H)return;buf[y*W+x]=pack(c[0],c[1],c[2])}
function B(x,y,c,a){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H||a<=0)return;const i=y*W+x,o=buf[i];const r=o&255,g=(o>>8)&255,b=(o>>16)&255;buf[i]=pack(r+(c[0]-r)*a,g+(c[1]-g)*a,b+(c[2]-b)*a)}
function PK(x,y,p){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H)return;buf[y*W+x]=p}
function R(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)P(x+i,y+j,c)}
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
const bay=(x,y)=>BAY[(y&3)*4+(x&3)];

/* ============================================================ world */
let mt,hl,fg,gb,mtMax,hillPines,fgTrees,flowers,stars,clouds,cabin,lakeEnd,flies;
let NR=0,rx,ry,rv,rl,rland,NS=0,sx_,sy_,sv_,sph_;
const splashes=[],smoke=[],birds=[];let shoot=null,bolt=null,flash=0,nextBolt=0,nextBird=4,nextShoot=20;

function genCloud(r,w){
  const hh=ceil(w*.46),mask=new Uint8Array(w*hh),base=hh-1,n=4+floor(r()*4);
  for(let i=0;i<n;i++){
    const f=(i+.5)/n,cx=f*w*.86+w*.07+(r()-.5)*w*.06,rr=(.12+.14*sin(f*PI)+r()*.05)*w,cy=base-rr*(.78+r()*.3);
    for(let y=max(0,floor(cy-rr));y<=min(base,ceil(cy+rr));y++)for(let x=max(0,floor(cx-rr));x<min(w,ceil(cx+rr));x++){
      if((x-cx)*(x-cx)+(y-cy)*(y-cy)<=rr*rr)mask[y*w+x]=1;
    }
  }
  const lv=new Uint8Array(w*hh);
  for(let y=0;y<hh;y++)for(let x=0;x<w;x++){
    if(!mask[y*w+x])continue;
    const top=y<2||!mask[(y-2)*w+x];
    if(top)lv[y*w+x]=1;
    else if(y>base-hh*.28)lv[y*w+x]=3;
    else if(y>base-hh*.38)lv[y*w+x]=((x+y)&1)?3:2;
    else lv[y*w+x]=2;
  }
  return{w,h:hh,lv};
}

/* ============================================================ city scenes */
const CITIES=[
  {id:'london',lat:51.507,lon:-.128,r:60},{id:'manchester',lat:53.483,lon:-2.244,r:35},{id:'liverpool',lat:53.408,lon:-2.992,r:30},
  {id:'edinburgh',lat:55.953,lon:-3.189,r:30},{id:'paris',lat:48.857,lon:2.352,r:50},{id:'newyork',lat:40.713,lon:-74.006,r:60},
  {id:'tokyo',lat:35.68,lon:139.69,r:60},{id:'sydney',lat:-33.87,lon:151.21,r:50}];
const CPAL={
  london:{far:[[128,122,126],[118,112,120],[140,130,128]],near:[[150,120,102],[166,148,128],[136,118,114]],hmin:.04,hmax:.12,water:[58,74,80]},
  manchester:{far:[[126,92,88],[116,84,84],[132,100,94]],near:[[160,86,66],[144,74,60],[172,100,76]],hmin:.04,hmax:.1,water:[48,66,72]},
  liverpool:{far:[[128,112,106],[118,104,104],[138,120,112]],near:[[160,128,104],[148,112,96],[170,146,120]],hmin:.04,hmax:.1,water:[44,70,92]},
  edinburgh:{far:[[116,108,106],[106,100,102],[126,116,112]],near:[[138,122,108],[124,110,100],[150,134,116]],hmin:.04,hmax:.1,water:[40,66,88]},
  paris:{far:[[200,190,170],[190,182,166],[208,198,176]],near:[[212,202,180],[200,192,172],[220,210,186]],hmin:.07,hmax:.09,water:[56,78,84],roof:2},
  newyork:{far:[[96,108,126],[84,96,116],[108,118,134]],near:[[120,124,132],[104,110,122],[134,130,128]],hmin:.06,hmax:.3,water:[34,64,92]},
  tokyo:{far:[[140,144,156],[126,132,146],[150,150,158]],near:[[160,156,160],[146,146,154],[170,160,160]],hmin:.05,hmax:.17,water:[40,66,88]},
  sydney:{far:[[130,140,152],[118,128,144],[142,148,156]],near:[[170,150,126],[150,136,122],[176,160,140]],hmin:.04,hmax:.15,water:[28,84,120]}};
const CLM={london:[['eye',.2],['bigben',.34],['stpauls',.5],['gherkin',.62],['shard',.78]],
  manchester:[['stack',.12],['townhall',.3],['beetham',.52],['stack',.74],['stack',.9]],
  liverpool:[['liver',.45],['stack',.84]],edinburgh:[['castle',.32],['scott',.58]],
  paris:[['sacre',.18],['eiffel',.45],['montp',.8]],newyork:[['statue',.12],['wtc',.4],['empire',.62]],
  tokyo:[['ttower',.4],['skytree',.72]],sydney:[['opera',.3],['bridge',.62],['stower',.86]]};
let theme=null,smokeSrc=[],waterCol=[30,70,104],lamps=[],cityFar=[],cityNear=[],cityLM=[];
const boat={x:-10,dir:1};
const WARM=[255,214,128];
function detectCity(){

/* ============================================================ drawing: sky */
function drawSky(){

  const oo=smooth(20,95,WS.cover)*.88;

  if(WS.fog>0){const l=.3*Hc[0]+.59*Hc[1]+.11*Hc[2];Hc=mix(Hc,[l+10,l+12,l+16],WS.fog*.8);Z=mix(Z,Hc,WS.fog*.55)}
  hz=Hc;

  const gc=tab(GLOW,sunAlt),sx=sunXY[0],sy=sunXY[1];

  const ex=new Float32Array(W),ey=new Float32Array(H);

    for(let x=0;x<W;x++){
      let r=rr,g=rg,b=rb;
      if(gs>.01){const e=ex[x]+ey[y];if(e<5){const a=exp(-e)*gs;r+=(gc[0]-r)*a;g+=(gc[1]-g)*a;b+=(gc[2]-b)*a}}

}

function halo(cx,cy,r0,Rr,col,strength){

function drawSun(){

const CRAT=[[-.35,-.3,.22],[.3,.1,.18],[-.1,.45,.15],[.1,-.5,.12],[.45,-.35,.1]];

/* ============================================================ clouds / birds / shooting star */
function drawClouds(dt){

  const dkm=clamp(WS.rain*.9+WS.thunder*.5+smooth(70,100,WS.cover)*.35+WS.fog*.2,0,1);
  const base=[[255,255,255],[226,233,246],[163,176,204]],drk=[[124,132,146],[92,99,114],[64,70,86]];

    c=mix(c,i===0?[255,176,128]:i===1?[240,150,130]:[150,100,140],sunset*(i===2?.5:.85));
    cc.push(pack(...mul(c,ambB).map(v=>v)));
  }
  const wind=.5+WS.wind/18;

    c.x+=c.sp*wind*dt;if(c.x>W+8)c.x=-c.w-8;

    const ox=round(c.x),oy=round(c.y),sp=c.spr;

function updateSpecials(dt,ms){

  nextBird-=dt;
  if(nextBird<=0){
    nextBird=18+Math.random()*26;

      const n=2+floor(Math.random()*3),dir=Math.random()<.5?1:-1;
      birds.push({x:dir>0?-12:W+12,y:H*(.14+Math.random()*.22),v:dir*(16+Math.random()*8),n,ph:Math.random()*6,off:Array.from({length:n},(_,i)=>[-i*dir*7+(Math.random()-.5)*3,(Math.random()-.5)*7+i*1.5])});
    }
  }
  for(let i=birds.length-1;i>=0;i--){const b=birds[i];b.x+=b.v*dt;if(b.x<-30||b.x>W+30)birds.splice(i,1)}
  nextShoot-=dt;
  if(nextShoot<=0){

    if(smooth(-4,-13,sunAlt)>.8&&WS.cover<35)shoot={x:Math.random()*W*.7,y:Math.random()*y0*.4,vx:70+Math.random()*30,vy:25+Math.random()*20,life:0};
  }

}

    for(let i=0;i<14;i++){B(shoot.x-shoot.vx*.012*i,shoot.y-shoot.vy*.012*i,[235,240,255],k*(1-i/14))}

}

function pine(x,by,h,ph,ms){

}
function oak(x,by,r,ph,ms){

/* ============================================================ lake */
function drawLake(ms){

  const glintCol=sunAlt>-1?[255,236,190]:[225,235,255];

      if(y>=fg[x])continue;

      const sx=clamp(x+dx,0,W-1);
      const o=buf[sy*W+sx];
      let r=o&255,g=(o>>8)&255,b=(o>>16)&255;
      r=r*.95+(wt[0]-r*.95)*mixW;g=g*.95+(wt[1]-g*.95)*mixW;b=b*.95+(wt[2]-b*.95)*mixW;
      if(((k+tick)%6)===0&&hash2(x,k)<.42){r+=16;g+=18;b+=22}
      if(glintStr>0){

function drawForeground(ms,dt){

/* ============================================================ main frame */
let last=0;
function frame(now){
  requestAnimationFrame(frame);
  if(now-last<29)return;
  const dt=min(.1,(now-last)/1000);last=now;
  const cost0=performance.now();
  const t=simNow(),ms=now;
  // weather smoothing
  const T=targets(eff());
  if(!wsInit){Object.assign(WS,T);WS.snowC=(T.snow>.2||T.temp<=-1)?1:0;wsInit=true}
  const k=1-exp(-dt/2.2);
  for(const key of['cover','rain','snow','fog','thunder','wind','temp'])WS[key]+=(T[key]-WS[key])*k;
  const snowT=(T.snow>.2||T.temp<=-1)?1:0;WS.snowC+=clamp(snowT-WS.snowC,-dt*.05,dt*.05);
  // sky bodies
  const c=celestial(t);
  sunAlt=c.sun.alt/rad;moonAlt=c.moon.alt;moonFrac=c.moon.frac;moonPhase=c.moon.phase;
  sunXY=skyXY(c.sun.az,c.sun.alt);moonXY=skyXY(c.moon.az,c.moon.alt);
  // ambient
  const mb=moonFrac*smooth(-3,15,moonAlt/rad)*(1-smooth(-10,0,sunAlt))*.2*(1-.7*WS.cover/100);
  let a0=tab(AMB,sunAlt);a0=[a0[0]+.55*mb,a0[1]+.75*mb,a0[2]+mb];ambB=a0;
  const o=smooth(20,95,WS.cover),storm=max(WS.rain,WS.thunder);
  let a1=sc3(a0,1-.3*o-.22*storm);const g=(a1[0]+a1[1]+a1[2])/3;a1=mix(a1,[g,g,g],o*.5);
  const f=flash*.5;amb=[a1[0]+f,a1[1]+f,a1[2]+f*1.1];
  lum=(amb[0]+amb[1]+amb[2])/3;
  dark=smooth(5,-5,sunAlt);
  const dd=new Date(t),yr=dd.getUTCFullYear();
  doy=floor((t-Date.UTC(yr,0,0))/864e5);
  const sd=(doy+(LAT()<0?183:0))%366;
  const sv=tab(SEAS,sd);seas={grass:[sv[0],sv[1],sv[2]],leafc:[sv[3],sv[4],sv[5]],leaf:sv[6]};
  // updates
  updateSpecials(dt,ms);updateRain(dt);updateSnow(dt);updateLightning(dt,ms);updateSmoke(dt);
  // draw
  drawSky();drawStars(ms);drawMoon();drawSun();drawClouds(dt);drawSpecials(ms);
  drawMountains();drawHills();drawCity(ms);drawLake(ms);drawBoat(ms,dt);drawForeground(ms,dt);
  drawSmoke();drawFlies(ms);drawFog(ms);drawRain();drawSnow(ms);drawLightning();
  drawText(t,ms);
  ctx.putImageData(img,0,0);
  frameCost+=(performance.now()-cost0-frameCost)*.1;
}
let frameCost=0;

async function jget(url,ms=9000){
  const ac=new AbortController(),id=setTimeout(()=>ac.abort(),ms);
  try{const r=await fetch(url,{signal:ac.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(id)}
}
function setLoc(loc,persist){

}
async function fromIP(){
  try{

    if(S.loc&&S.loc.mode==='manual')return;
    setLoc({lat:+j.latitude,lon:+j.longitude,name:j.city||j.region||'',tz:j.timezone||TZ(),mode:'auto'},true);
  }catch{if(!S.loc){S.loc={lat:40.7,lon:-74,name:'',tz:TZ(),mode:'auto'};genWorld();$('#panel').hidden=false;poke(true)}}
}
function fromGeo(manual){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(async pos=>{
    if(!manual&&S.loc&&S.loc.mode==='manual')return;
    const lat=pos.coords.latitude,lon=pos.coords.longitude;let name='';
    try{const j=await jget(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`,6000);name=j.city||j.locality||j.principalSubdivision||''}catch{}
    setLoc({lat,lon,name,tz:TZ(),mode:manual?'manual':'auto'},true);

}
async function fetchWeather(){
  if(!S.loc)return;
  const {lat,lon}=S.loc;
  try{
    const j=await jget(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,cloud_cover,wind_speed_10m&daily=sunrise,sunset&timezone=auto&wind_speed_unit=kmh&forecast_days=1`);
    if(!j.current)throw new Error('no data');
    S.wx={t:j.current.temperature_2m,code:j.current.weather_code,cover:j.current.cloud_cover,wind:j.current.wind_speed_10m,rise:j.daily&&j.daily.sunrise&&j.daily.sunrise[0],set:j.daily&&j.daily.sunset&&j.daily.sunset[0],at:Date.now()};

}

  idleT=setTimeout(()=>{if(panel.hidden){ui.classList.remove('on');document.body.classList.add('idle')}},3500);
}
['mousemove','pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,()=>poke(),{passive:true}));
function togglePanel(force){
  panel.hidden=force===undefined?!panel.hidden:!force;
  gear.setAttribute('aria-expanded',String(!panel.hidden));
  gear.textContent=panel.hidden?'Set':'Close';poke();
}
gear.onclick=()=>togglePanel();
function toggleFS(){
  if(document.fullscreenElement)document.exitFullscreen();
  else(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen||(()=>{})).call(document.documentElement);
}
$('#fs').onclick=toggleFS;
addEventListener('keydown',e=>{
  if(e.target.matches('input,select'))return;
  if(e.key==='f'||e.key==='F')toggleFS();
  else if(e.key==='s'||e.key==='S')togglePanel();
  else if(e.key==='Escape'&&!panel.hidden)togglePanel(false);
});
addEventListener('dblclick',e=>{if(!e.target.closest('#ui'))toggleFS()});
function updateCur(){$('#cur').textContent=S.loc?`${S.loc.name||'Unnamed place'}  ·  ${S.loc.lat.toFixed(2)}, ${S.loc.lon.toFixed(2)}`:'Locating…'}
$('#units').value=S.units;$('#h12').value=S.h12?'1':'0';$('#secs').value=S.secs?'1':'0';$('#preset').value=S.preset in PRESETS?S.preset:'live';$('#speed').value=String(S.speed);
$('#scene').value=S.scene;
$('#scene').onchange=e=>{S.scene=e.target.value;store.set('scene',S.scene);genWorld()};
$('#units').onchange=e=>{S.units=e.target.value;store.set('units',S.units)};
$('#h12').onchange=e=>{S.h12=e.target.value==='1';store.set('h12',S.h12)};
$('#secs').onchange=e=>{S.secs=e.target.value==='1';store.set('secs',S.secs)};
$('#preset').onchange=e=>{S.preset=e.target.value};
$('#speed').onchange=e=>{S.simBase=simNow();S.realBase=Date.now();S.speed=+e.target.value};
function minsNow(){const p=localParts(simNow());return p.h*60+p.m}
const tod=$('#tod');
tod.addEventListener('input',()=>{
  const m=+tod.value,cur=minsNow();S.simBase=simNow()+(m-cur)*60000;S.realBase=Date.now();partsSec=-1;
  $('#tlab').textContent=fmtHM(floor(m/60),m%60);
});
setInterval(()=>{if(document.activeElement!==tod){tod.value=minsNow();$('#tlab').textContent=S.speed===1&&Math.abs(simNow()-Date.now())<5000?'now':fmtHM(floor(minsNow()/60),minsNow()%60)}},1000);
$('#reset').onclick=()=>{S.simBase=Date.now();S.realBase=Date.now();S.speed=1;S.preset='live';$('#speed').value='1';$('#preset').value='live'};
$('#geo').onclick=()=>fromGeo(true);
let qT;
$('#q').addEventListener('input',e=>{
  clearTimeout(qT);const v=e.target.value.trim(),ul=$('#results');
  if(v.length<2){ul.innerHTML='';return}
  qT=setTimeout(async()=>{
    try{
      const j=await jget(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=6&language=en&format=json`,7000);
      ul.innerHTML='';
      for(const r of j.results||[]){
        const li=document.createElement('li'),b=document.createElement('button');
        b.textContent=[r.name,r.admin1,r.country].filter(Boolean).join(', ');
        b.onclick=()=>{setLoc({lat:r.latitude,lon:r.longitude,name:r.name,tz:r.timezone||TZ(),mode:'manual'},true);ul.innerHTML='';$('#q').value=''};
        li.appendChild(b);ul.appendChild(li);
      }
      if(!(j.results||[]).length)ul.innerHTML='<li class="hint">No matches</li>';
    }catch{ul.innerHTML='<li class="hint">Search unavailable offline</li>'}
  },280);
});

/* ============================================================ boot */
addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(layout,120)});
async function wake(){try{if('wakeLock' in navigator)await navigator.wakeLock.request('screen')}catch{}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){wake();if(!S.wx||Date.now()-S.wx.at>10*60000)fetchWeather()}});
addEventListener('pointerdown',wake,{once:true});wake();
layout();updateCur();
if(qs.get('time')){const [hh,mm]=qs.get('time').split(':').map(Number);const cur=minsNow();S.simBase=simNow()+((hh*60+(mm||0))-cur)*60000;S.realBase=Date.now();partsSec=-1}
if(S.loc&&S.loc.mode==='manual'){fetchWeather()}
else{if(S.loc)fetchWeather();fromIP();fromGeo(false)}
setInterval(fetchWeather,10*60000);
window.__pixelsky={S,WS,dbg:()=>({sunXY,sunAlt,y0,W,H,moonXY,moonAlt:moonAlt/rad,frameCost})};
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
